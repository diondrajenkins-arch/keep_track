<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Keep Track</title>
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
 <style>
 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

 :root {
 --navy: #0d1b2a;
 --navy-mid: #1b2c3e;
 --gold: #c9a84c;
 --white: #ffffff;
 --off-white: #f5f5f0;
 }

 body {
 font-family: 'Inter', system-ui, sans-serif;
 background: var(--navy);
 color: var(--white);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 overflow: hidden;
 }

 .intro-wrapper {
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 text-align: center;
 padding: 40px 24px;
 animation: fadeIn 1.2s ease forwards;
 }

 @keyframes fadeIn {
 from { opacity: 0; transform: translateY(24px); }
 to { opacity: 1; transform: translateY(0); }
 }

 .logo-mark {
 width: 80px;
 height: 80px;
 background: var(--gold);
 border-radius: 20px;
 display: flex;
 align-items: center;
 justify-content: center;
 margin: 0 auto 28px;
 box-shadow: 0 8px 32px rgba(201,168,76,0.35);
 }

 .logo-mark svg {
 width: 44px;
 height: 44px;
 }

 .brand-name {
 font-family: 'Playfair Display', Georgia, serif;
 font-size: 3rem;
 font-weight: 700;
 color: var(--gold);
 letter-spacing: 2px;
 margin-bottom: 16px;
 line-height: 1.1;
 }

 .tagline {
 font-size: 1.05rem;
 font-weight: 300;
 color: rgba(255,255,255,0.72);
 max-width: 380px;
 line-height: 1.7;
 margin-bottom: 48px;
 }

 .tagline span {
 color: var(--gold);
 font-weight: 500;
 }

 .features {
 display: flex;
 gap: 20px;
 margin-bottom: 52px;
 flex-wrap: wrap;
 justify-content: center;
 }

 .feature-pill {
 background: rgba(255,255,255,0.07);
 border: 1px solid rgba(201,168,76,0.25);
 border-radius: 40px;
 padding: 10px 20px;
 font-size: 0.82rem;
 font-weight: 500;
 color: rgba(255,255,255,0.8);
 letter-spacing: 0.5px;
 display: flex;
 align-items: center;
 gap: 8px;
 }

 .feature-pill .dot {
 width: 7px;
 height: 7px;
 border-radius: 50%;
 background: var(--gold);
 flex-shrink: 0;
 }

 .enter-btn {
 background: var(--gold);
 color: var(--navy);
 border: none;
 padding: 16px 52px;
 border-radius: 50px;
 font-family: 'Inter', system-ui, sans-serif;
 font-size: 1rem;
 font-weight: 700;
 letter-spacing: 1px;
 cursor: pointer;
 text-decoration: none;
 display: inline-block;
 transition: transform 0.2s, box-shadow 0.2s;
 box-shadow: 0 4px 24px rgba(201,168,76,0.4);
 }

 .enter-btn:hover {
 transform: translateY(-2px);
 box-shadow: 0 8px 32px rgba(201,168,76,0.55);
 }

 .footer-note {
 margin-top: 40px;
 font-size: 0.75rem;
 color: rgba(255,255,255,0.28);
 letter-spacing: 0.5px;
 }

 .gold-bar {
 width: 60px;
 height: 3px;
 background: var(--gold);
 border-radius: 2px;
 margin: 0 auto 32px;
 }
 </style>
</head>
<body>

 <div class="intro-wrapper">

 <div class="logo-mark">
 <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
 <rect x="6" y="4" width="24" height="32" rx="3" stroke="#0d1b2a" stroke-width="2.5" fill="none"/>
 <line x1="11" y1="13" x2="24" y2="13" stroke="#0d1b2a" stroke-width="2.5" stroke-linecap="round"/>
 <line x1="11" y1="19" x2="24" y2="19" stroke="#0d1b2a" stroke-width="2.5" stroke-linecap="round"/>
 <line x1="11" y1="25" x2="19" y2="25" stroke="#0d1b2a" stroke-width="2.5" stroke-linecap="round"/>
 <circle cx="34" cy="34" r="8" fill="#0d1b2a"/>
 <line x1="31" y1="34" x2="37" y2="34" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
 <line x1="34" y1="31" x2="34" y2="37" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
 </svg>
 </div>

 <h1 class="brand-name">Keep Track</h1>
 <div class="gold-bar"></div>

 <p class="tagline">
 Your money. Your calendar. Your control.<br/>
 <span>Simple tools built for real life.</span>
 </p>

 <div class="features">
 <div class="feature-pill"><span class="dot"></span>Budget Tracking</div>
 <div class="feature-pill"><span class="dot"></span>Bill Reminders</div>
 <div class="feature-pill"><span class="dot"></span>Pay Day Calendar</div>
 <div class="feature-pill"><span class="dot"></span>Smart Notifications</div>
 </div>

 <a href="index.html" class="enter-btn">GET STARTED</a>

 <p class="footer-note">Your data stays on your device. Private by design.</p>

 </div>

</body>
</html>
